name: Deploy docs and Family Hub preview to GitHub Pages

on:
  push:
    branches:
      - feature/adaptive-dashboard-ribbon
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build existing documentation site
        working-directory: website
        run: |
          npm ci
          npm run build
      - name: Add fictional-data feature preview
        run: |
          mkdir -p website/build/preview
          cp preview/index.html website/build/preview/index.html
          cp custom_components/family_hub/dashboard/ribbon.js website/build/preview/ribbon.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
